<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notebook Lenovo</title>
    <link rel="stylesheet" href="notebook.css">

    <style>
        #contenedor-principal {
            display: grid;
            grid-template-columns: 30% 30% auto;
            grid-gap: 2%;
            justify-content: stretch;
            grid-template-areas:
                    "titulo titulo titulo"
            "imagen imagen descripcion"
            "imagen imagen boton-comprar"
        "feedback feedback feedback"
        }

        #titulo {
            grid-area: titulo;
        }

        #div-imagen-notebook {
            grid-area: imagen;
            width: 100%;
            height: 100%;
        }

        #descripcion {
            grid-area: descripcion;
        }

        #boton-comprar {
            grid-area: boton-comprar;
        }

        #feedback {
            grid-area: feedback;
        }
    </style>

    <script src="notebook.js" defer type="module"></script>
</head>
<body>

<div id="contenedor-principal">

    <h1 id="titulo"></h1>

    <div id="div-imagen-notebook">
        <img id="imagen-notebook" class="caja"
             src=""
             alt="">
    </div>

    <div class="caja" id="descripcion">
        <p id="texto-descripcion"></p>

        <p>Características</p>
        <ul id="caracteristicas">

        </ul>

        <a href="" id="link-pagina">Página oficial</a>

        <p>Precio: <i>$1.000.000</i></p>
        
        <button id="boton-favoritos">Agregar a favoritos</button>

    </div>

    <div class="caja" id="boton-comprar">
        <button>Comprar</button>
    </div>

    <div class="caja" id="feedback">
        <form action="/submit-notebook" method="post">
            <label id="comentario">
                Comentario:
                <textarea name="comentario" placeholder="Ingrese su comentario" required></textarea>
            </label>

            <div id="puntacion">
                <label>
                    1 <input type="radio" name="puntuacion" value="1">
                </label>

                <label>
                    2 <input type="radio" name="puntuacion" value="2">
                </label>

                <label>
                    3 <input type="radio" name="puntuacion" value="3">
                </label>

                <label>
                    4 <input type="radio" name="puntuacion" value="4">
                </label>

                <label>
                    5 <input type="radio" name="puntuacion" value="5">
                </label>

            </div>

            <div id="boton-comentario">
                <input  type="submit" value="Enviar comentario">
            </div>

        </form>
    </div>

</div>
</body>
</html>
